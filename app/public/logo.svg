<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a3e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#daa520"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e8ff"/>
      <stop offset="50%" stop-color="#c0c0e0"/>
      <stop offset="100%" stop-color="#9090c0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Subtle lightning bolt accent -->
  <path d="M256 60 L270 120 L258 120 L268 160 L244 110 L256 110 Z" fill="url(#gold)" opacity="0.6"/>
  <!-- English H -->
  <text x="148" y="340" font-family="Georgia, 'Times New Roman', serif" font-size="220" font-weight="bold" fill="url(#gold)" text-anchor="middle">H</text>
  <!-- Korean 해 -->
  <text x="364" y="340" font-family="'Noto Serif KR', 'Batang', serif" font-size="200" font-weight="bold" fill="url(#silver)" text-anchor="middle">해</text>
  <!-- Small sparkle dots -->
  <circle cx="80" cy="80" r="3" fill="#ffd700" opacity="0.5"/>
  <circle cx="432" cy="95" r="2.5" fill="#e8e8ff" opacity="0.4"/>
  <circle cx="100" cy="440" r="2" fill="#ffd700" opacity="0.3"/>
  <circle cx="420" cy="420" r="3" fill="#e8e8ff" opacity="0.4"/>
  <circle cx="256" cy="460" r="2" fill="#ffd700" opacity="0.3"/>
</svg>
